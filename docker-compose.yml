services:
  postgres_db1:
    image: postgres:16
    container_name: postgres_reserv_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: ReserveDB
    ports:
      - "15432:5432"
    volumes:
      - postgres_db1:/var/lib/postgresql/data
    restart: unless-stopped

  postgres_db2:
    image: postgres:16
    container_name: postgres_hotels_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: HotelDB
    ports:
      - "15433:5432"
    volumes:
      - postgres_db2:/var/lib/postgresql/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped

  gatewayapi:
    image: ${DOCKER_REGISTRY-}gatewayapi
    build:
      context: ..
      dockerfile: Otus_Reservation_Project/Services/GatewayAPI/Dockerfile
    ports:
      - "15437:12321"

volumes:
  postgres_db1:
  postgres_db2:


